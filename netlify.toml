[build]
  command = "pnpm build"
  publish = "dist"

# Redirect slashless blog URLs to their trailing-slash versions
[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug/"
  status = 301
  force = true

# Serve 200 OK to crawlers (LinkedIn, Slack, etc.)
[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug/"
  status = 200
  force = true
  conditions = { UserAgent = ["LinkedInBot", "Slackbot", "Discordbot", "Twitterbot", "facebookexternalhit"] }
